<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tal &amp; Tas">
  <!--
    Значок сайта: тот, что видно на вкладке браузера.

    Нарисован кодом, а не картинкой — поэтому весит меньше килобайта
    и остаётся чётким на любом экране, хоть на часах, хоть на 4K.

    Смысл знака: слева тёплая форма (тал — ива), справа холодная
    прямая (тас — камень). Тот же контраст, что и во всём оформлении.

    Зелёный здесь светлее, чем на сайте (#8A9A7B против #687A57).
    Так нужно: на сайте он лежит на светлом фоне, а тут на тёмном.
    Тёмно-зелёный на тёмном превратился бы в грязное пятно.
  -->
  <rect width="64" height="64" fill="#23272B"/>
  <path d="M20 46 C20 30, 26 20, 34 14" fill="none" stroke="#8A9A7B" stroke-width="4" stroke-linecap="round"/>
  <rect x="40" y="18" width="4" height="28" rx="1" fill="#F7F4EF"/>
</svg>
