# Настройки для хостинга Netlify.
#
# Файл нужен для того, чтобы Netlify сам знал, как собирать сайт,
# и не пришлось ничего вводить руками в его интерфейсе.
#
# Если выберем Cloudflare Pages вместо Netlify — этот файл не помешает,
# там те же значения задаются в настройках проекта:
#   команда сборки:  npm run build
#   папка с сайтом:  dist

[build]
  # Что выполнить, чтобы собрать сайт
  command = "npm run build"
  # Какую папку после этого выложить в интернет
  publish = "dist"

[build.environment]
  # Версия Node.js. Без этой строки Netlify возьмёт свою, обычно старую,
  # и сборка упадёт: нашему Astro нужен минимум 22.12.
  NODE_VERSION = "22"
